<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menú del Día El Negrito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --verde:#1f6b3a;
    --rojo:#9b1c1c;
    --gold:#b9821f;
    --bg:#f7f2e6;
    --surface:#ffffff;
    --surface-border:#e7ddc6;
    --text:#2a2420;
    --text-muted:#7a7061;
    --focus:#b9821f;
    --shadow:rgba(42,36,32,0.10);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --verde:#3aa464;
      --rojo:#e05a50;
      --gold:#e3ac4a;
      --bg:#18140f;
      --surface:#241f18;
      --surface-border:#3a3226;
      --text:#f1ebdd;
      --text-muted:#b3a690;
      --shadow:rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"]{
    --verde:#3aa464;
    --rojo:#e05a50;
    --gold:#e3ac4a;
    --bg:#18140f;
    --surface:#241f18;
    --surface-border:#3a3226;
    --text:#f1ebdd;
    --text-muted:#b3a690;
    --shadow:rgba(0,0,0,0.35);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    padding:36px 16px 64px;
    background:var(--bg);
    color:var(--text);
    font-family:'Nunito',Arial,sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:30px;
  }
  ::selection{background:var(--gold);color:#fff;}
  :focus-visible{outline:2.5px solid var(--focus);outline-offset:2px;}

  header.page-head{
    text-align:center;
    max-width:640px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  h1.page-title{
    font-family:'Anton',Impact,sans-serif;
    font-weight:400;
    color:var(--text);
    font-size:clamp(24px,4vw,32px);
    letter-spacing:0.3px;
    margin:0;
    text-wrap:balance;
  }
  .page-sub{
    margin:0;
    font-size:15px;
    color:var(--text-muted);
    font-weight:600;
  }

  .step-label{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:'Nunito',sans-serif;
    font-weight:800;
    font-size:13px;
    letter-spacing:0.6px;
    text-transform:uppercase;
    color:var(--text-muted);
  }
  .step-label .num{
    display:flex;
    align-items:center;
    justify-content:center;
    width:24px;
    height:24px;
    border-radius:50%;
    background:var(--gold);
    color:#fff;
    font-family:'Anton',Impact,sans-serif;
    font-size:13px;
    flex-shrink:0;
  }

  /* ---------- PASO 1: formulario ---------- */
  .form-card{
    width:100%;
    max-width:900px;
    background:var(--surface);
    border:1px solid var(--surface-border);
    border-radius:16px;
    box-shadow:0 10px 30px var(--shadow);
    padding:22px 24px 28px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .form-columns{
    display:flex;
    gap:28px;
    flex-wrap:wrap;
  }
  .form-col{
    flex:1;
    min-width:260px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .form-col h3{
    font-family:'Anton',Impact,sans-serif;
    font-weight:400;
    font-size:17px;
    letter-spacing:0.5px;
    margin:0;
    padding-bottom:8px;
    border-bottom:3px solid var(--col-color);
    color:var(--col-color);
  }
  .form-col.entradas{--col-color:var(--verde);}
  .form-col.segundos{--col-color:var(--rojo);}

  .form-row{
    display:flex;
    gap:8px;
    align-items:center;
  }
  .form-row input[type=text]{
    font-family:'Nunito',sans-serif;
    font-size:14px;
    font-weight:600;
    color:var(--text);
    background:var(--bg);
    padding:9px 11px;
    border:1.5px solid var(--surface-border);
    border-radius:8px;
    outline:none;
    transition:border-color .15s ease;
    min-width:0;
  }
  .form-row input[type=text]::placeholder{color:var(--text-muted);font-weight:500;}
  .form-row input[type=text]:focus{border-color:var(--col-color);}
  .form-row .fname{flex:2;}
  .form-row .fprice{flex:1;max-width:110px;}
  .form-row .frow-remove{
    background:none;
    border:none;
    color:var(--rojo);
    font-size:17px;
    cursor:pointer;
    flex-shrink:0;
    padding:2px;
    line-height:1;
    border-radius:6px;
  }
  .form-row .frow-remove:hover{background:var(--bg);}
  .form-add{
    align-self:flex-start;
    background:var(--col-color);
    color:#fff;
    border:none;
    border-radius:8px;
    padding:9px 15px;
    font-weight:800;
    font-size:13px;
    cursor:pointer;
    font-family:'Nunito',sans-serif;
    transition:filter .15s ease;
  }
  .form-add:hover{filter:brightness(1.12);}
  .hint{
    max-width:900px;
    text-align:center;
    color:var(--text-muted);
    font-size:14px;
    font-weight:600;
    margin:0;
  }

  /* ---------- PASO 2: plantilla ---------- */
  #poster{
    position:relative;
    width:1100px;
    max-width:100%;
    background:#fff;
    box-shadow:0 6px 24px rgba(0,0,0,0.15);
    line-height:0;
  }
  #poster img{display:block;width:100%;height:auto;}

  .overlay{
    position:absolute;
    left:0.86%;
    width:27.42%;
    top:36.8%;
    height:29.44%;
    display:flex;
    flex-direction:column;
    justify-content:space-evenly;
    align-items:stretch;
    padding:0 4%;
    line-height:normal;
  }
  .overlay.segundos{
    left:29.99%;
    width:32.86%;
  }

  .erow{
    display:flex;
    align-items:baseline;
    gap:2%;
    width:100%;
  }
  .erow .star{
    flex-shrink:0;
    line-height:1;
  }
  .overlay.entradas .erow .star{color:var(--verde);}
  .overlay.segundos .erow .star{color:var(--rojo);}

  .erow .ename{
    font-family:'Anton',Impact,sans-serif;
    line-height:1.15;
    color:#111;
    text-transform:uppercase;
    white-space:nowrap;
  }
  .erow .dots{
    flex:1;
    border-bottom:2px dotted #999;
    margin:0 2px 6px;
    min-width:6px;
  }
  .erow .eprice{
    font-family:'Anton',Impact,sans-serif;
    line-height:1.15;
    color:var(--rojo);
    white-space:nowrap;
    flex-shrink:0;
  }

  .controls-bar{
    width:1100px;
    max-width:100%;
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    justify-content:center;
  }
  .export-btn{
    background:var(--text);
    color:var(--bg);
    border:none;
    border-radius:9px;
    padding:15px 26px;
    font-size:15px;
    font-weight:800;
    cursor:pointer;
    font-family:'Nunito',sans-serif;
    box-shadow:0 6px 18px var(--shadow);
    transition:transform .12s ease, filter .15s ease;
  }
  .export-btn:hover{filter:brightness(1.15);}
  .export-btn:active{transform:translateY(1px);}

  @media (max-width:960px){
    .form-columns{flex-direction:column;}
  }

  @media print{
    html,body{background:#fff;padding:0;margin:0;display:block;width:210mm;height:229mm;overflow:hidden;}
    .page-head,.hint,.step-label,.form-card,.controls-bar{display:none !important;}
    #poster{box-shadow:none;width:210mm;max-width:210mm;margin:0;}
    * { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    @page{size:210mm 230mm;margin:0;}
  }
</style>
</head>
<body>

<header class="page-head">
  <h1 class="page-title">Menú del Día El Negrito</h1>
  <p class="page-sub">Arma la carta de hoy y expórtala en PDF, sin tocar el diseño.</p>
</header>

<div class="form-card">
  <div class="step-label"><span class="num">1</span> Ingresa tus platos</div>
  <p class="hint">Las entradas van solo con nombre (no llevan precio). Los segundos van con nombre y precio. La plantilla de abajo se va llenando sola.</p>
  <div class="form-columns">
    <div class="form-col entradas">
      <h3>ENTRADAS</h3>
      <div id="form-entradas"></div>
      <button class="form-add" onclick="addItem('entradas')">+ Agregar entrada</button>
    </div>
    <div class="form-col segundos">
      <h3>SEGUNDOS</h3>
      <div id="form-segundos"></div>
      <button class="form-add" onclick="addItem('segundos')">+ Agregar segundo</button>
    </div>
  </div>
</div>

<div class="step-label"><span class="num">2</span> Vista previa y exportar</div>

  <div class="overlay entradas" id="overlay-entradas"></div>
  <div class="overlay segundos" id="overlay-segundos"></div>
</div>

<div class="controls-bar">
  <button class="export-btn" onclick="window.print()">📄 Exportar a PDF</button>
</div>

<script>
const SECTION_CONFIG = {
  entradas: { hasPrice: false },
  segundos: { hasPrice: true }
};

const data = {
  entradas: [{name:''}],
  segundos: [{name:'', price:''}]
};

function addItem(section){
  data[section].push(SECTION_CONFIG[section].hasPrice ? {name:'', price:''} : {name:''});
  renderForm(section);
  renderPoster();
}

function removeItem(section, idx){
  data[section].splice(idx,1);
  renderForm(section);
  renderPoster();
}

function updateItem(section, idx, field, value){
  data[section][idx][field] = value;
  renderPoster();
}

function renderForm(section){
  const hasPrice = SECTION_CONFIG[section].hasPrice;
  const container = document.getElementById('form-'+section);
  container.innerHTML = '';
  data[section].forEach((item, idx) => {
    const row = document.createElement('div');
    row.className = 'form-row';

    const nameInput = document.createElement('input');
    nameInput.type = 'text';
    nameInput.className = 'fname';
    nameInput.placeholder = 'Nombre del plato';
    nameInput.value = item.name;
    nameInput.oninput = () => updateItem(section, idx, 'name', nameInput.value);
    row.appendChild(nameInput);

    if(hasPrice){
      const priceInput = document.createElement('input');
      priceInput.type = 'text';
      priceInput.className = 'fprice';
      priceInput.placeholder = 'S/ 0.00';
      priceInput.value = item.price;
      priceInput.oninput = () => updateItem(section, idx, 'price', priceInput.value);
      row.appendChild(priceInput);
    }

    const removeBtn = document.createElement('button');
    removeBtn.className = 'frow-remove';
    removeBtn.innerHTML = '✕';
    removeBtn.onclick = () => removeItem(section, idx);
    row.appendChild(removeBtn);

    container.appendChild(row);
  });
}

function renderPoster(){
  ['entradas','segundos'].forEach(section=>{
    const hasPrice = SECTION_CONFIG[section].hasPrice;
    const overlay = document.getElementById('overlay-'+section);
    overlay.innerHTML = '';
    data[section].forEach(item=>{
      if(!item.name || !item.name.trim()) return;
      const row = document.createElement('div');
      row.className = 'erow';

      const star = document.createElement('span');
      star.className = 'star';
      star.textContent = '✻';
      row.appendChild(star);

      const name = document.createElement('span');
      name.className = 'ename';
      name.textContent = item.name;
      row.appendChild(name);

      if(hasPrice){
        const dots = document.createElement('span');
        dots.className = 'dots';
        row.appendChild(dots);

        const price = document.createElement('span');
        price.className = 'eprice';
        price.textContent = item.price;
        row.appendChild(price);
      }

      overlay.appendChild(row);
    });
    layoutSection(overlay, hasPrice);
  });
}

// Sizes rows based on how many dishes are in the box: few dishes (e.g. 2-4
// entradas) get noticeably bigger text so the box doesn't look empty; many
// dishes (e.g. 6-9 segundos) shrink to spread evenly and still fit. Every
// row in a section always ends up the SAME font size — if one dish name is
// too long to fit, the whole section shrinks together (never just that row),
// and shorter names simply get a longer dotted leader instead of bigger text.
function layoutSection(overlay, hasPrice){
  const rows = overlay.querySelectorAll('.erow');
  const n = rows.length;
  if(!n) return;

  const boxH = overlay.clientHeight;
  const MIN_FONT = 12;
  const MAX_FONT = 36;
  let fontPx = (boxH / n) * 0.44;
  fontPx = Math.min(Math.max(fontPx, MIN_FONT), MAX_FONT);

  const setSize = (size) => {
    rows.forEach(row=>{
      row.querySelector('.star').style.fontSize = (size*0.82).toFixed(1) + 'px';
      row.querySelector('.ename').style.fontSize = size.toFixed(1) + 'px';
      if(hasPrice) row.querySelector('.eprice').style.fontSize = size.toFixed(1) + 'px';
    });
  };

  setSize(fontPx);

  // find the single worst-fitting row and shrink ALL rows by that same
  // ratio, so every dish in the section stays exactly the same size.
  let minRatio = 1;
  rows.forEach(row=>{
    const rowWidth = row.clientWidth;
    const starW = row.querySelector('.star').getBoundingClientRect().width;
    const nameW = row.querySelector('.ename').getBoundingClientRect().width;
    let total, reserve;
    if(hasPrice){
      const priceW = row.querySelector('.eprice').getBoundingClientRect().width;
      reserve = rowWidth * 0.08; // minimum dotted leader + gaps
      total = starW + nameW + priceW + reserve;
    } else {
      reserve = rowWidth * 0.04;
      total = starW + nameW + reserve;
    }
    if(total > rowWidth){
      minRatio = Math.min(minRatio, rowWidth / total);
    }
  });

  if(minRatio < 1){
    minRatio = Math.max(minRatio, 0.4);
    setSize(fontPx * minRatio);
  }
}

function relayoutAll(){
  ['entradas','segundos'].forEach(section=>{
    layoutSection(document.getElementById('overlay-'+section), SECTION_CONFIG[section].hasPrice);
  });
}

['entradas','segundos'].forEach(renderForm);
renderPoster();
window.addEventListener('resize', relayoutAll);
window.addEventListener('load', relayoutAll);
</script>
